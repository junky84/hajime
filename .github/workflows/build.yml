# Testet die Logik und baut die Versionen ohne Installation:
#  - macOS:   .app im .zip (Universal: Apple Silicon + Intel)
#  - Windows: .zip mit „Hajime starten“ – läuft mit der offiziellen, signierten node.exe
#             und zeigt Hajime in Microsoft Edge (keine eigene .exe, daher kein Virenfehlalarm)
#  - Web:     .zip mit HTML-Version für Chrome/Edge (keine Programmdatei)
# Bei einem Tag "v1.2.3" werden die Versionen als GitHub-Release veröffentlicht.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            name: Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version aus Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Starttest der fertigen Pakete
        run: node scripts/smoketest.js
      - name: Starttest-Ergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Starttest-${{ matrix.name }}
          path: selftest/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: Hajime-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Version aus Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: node.exe von nodejs.org laden und prüfen (Prüfsumme, Signatur der OpenJS Foundation)
        shell: pwsh
        run: |
          # erst in eine Variable: Invoke-RestMethod gibt die Liste sonst als ein Objekt weiter
          $all = Invoke-RestMethod https://nodejs.org/dist/index.json
          $v = ($all | Where-Object { $_.lts } | Select-Object -First 1).version
          if (-not $v) { throw 'Keine LTS-Version gefunden' }
          Write-Host "Node.js $v (LTS)"
          Invoke-WebRequest "https://nodejs.org/dist/$v/win-x64/node.exe" -OutFile node.exe
          $sums = (Invoke-WebRequest "https://nodejs.org/dist/$v/SHASUMS256.txt").Content
          $want = (($sums -split "`n") | Where-Object { $_ -match ' win-x64/node\.exe$' } | Select-Object -First 1).Split(' ')[0].Trim()
          $have = (Get-FileHash node.exe -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $have) { throw "Prüfsumme falsch: $have statt $want" }
          $sig = Get-AuthenticodeSignature node.exe
          Write-Host "Signatur: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'OpenJS') { throw 'node.exe ist nicht gültig signiert' }
          # Lizenztext muss mit node.exe weitergegeben werden
          Invoke-WebRequest "https://raw.githubusercontent.com/nodejs/node/$v/LICENSE" -OutFile node-LICENSE.txt
      - name: Paket bauen
        run: node scripts/build-windows.js --node node.exe --node-license node-LICENSE.txt
      - name: Starttest (Start, Freigabe, Zentrale, Suche, Edge)
        run: node scripts/windows-smoketest.js
      - name: Starttest-Ergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Starttest-Windows
          path: selftest/
          if-no-files-found: ignore
      - name: Zip packen
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          Compress-Archive -Path "dist/Hajime-$v-Windows" -DestinationPath "dist/Hajime-$v-Windows.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: Hajime-Windows
          path: dist/*-Windows.zip
          if-no-files-found: error

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Version aus Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run build:web
      - name: Zip packen
        run: |
          V=$(node -p "require('./package.json').version")
          cd dist && zip -r -q "Hajime-$V-Web.zip" Hajime-Web
      - uses: actions/upload-artifact@v7
        with:
          name: Hajime-Web
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, web, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: Hajime-*
          merge-multiple: true
      - name: Dateien prüfen
        run: |
          ls -la artifacts
          ls artifacts/*-Mac.zip artifacts/*-Web.zip artifacts/*-Windows.zip
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*-Mac.zip
            artifacts/*-Web.zip
            artifacts/*-Windows.zip
          generate_release_notes: true
          body: |
            **Download:** `Hajime-…-Windows.zip` (Windows: entpacken, „Hajime starten“ doppelklicken), `Hajime-…-Mac.zip` (macOS) oder `Hajime-…-Web.zip` (jeder Rechner mit Chrome/Edge).
            Anleitung: [Schnellstart](https://github.com/junky84/hajime/blob/main/docs/schnellstart.md) · [Benutzerhandbuch](https://github.com/junky84/hajime/blob/main/docs/benutzerhandbuch.md)
