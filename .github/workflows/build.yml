# Testet die Logik und baut die Versionen ohne Installation:
#  - macOS:   .app im .zip (Universal: Apple Silicon + Intel)
#  - Web:     .zip mit HTML-Version für Chrome/Edge (keine Programmdatei)
# Bei einem Tag "v1.2.3" werden Mac- und Webversion als GitHub-Release veröffentlicht.
# Windows wird nicht mehr gebaut: Die unsignierte .exe löst Virenwarnungen aus
# (Defender). Wieder aufnehmen: Matrix-Eintrag mit os: windows-latest,
# script: dist:win, name: Windows ergänzen und dist/*.exe hochladen.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            name: Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version aus Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Starttest der fertigen Pakete
        run: node scripts/smoketest.js
      - name: Starttest-Ergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Starttest-${{ matrix.name }}
          path: selftest/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: Hajime-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Version aus Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run build:web
      - name: Zip packen
        run: |
          V=$(node -p "require('./package.json').version")
          cd dist && zip -r -q "Hajime-$V-Web.zip" Hajime-Web
      - uses: actions/upload-artifact@v7
        with:
          name: Hajime-Web
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*-Mac.zip
            artifacts/*-Web.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
